<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Bruce AI Assistant">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- fines lignes décoratives -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="135" x2="500" y2="135"/>
    <line x1="700" y1="135" x2="1120" y2="135"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="80" cy="135" r="3"/>
    <circle cx="1120" cy="135" r="3"/>
  </g>

  <!-- emblème original : hexagone + onde vocale -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-linejoin="round">
    <polygon points="600,55 673,97 673,173 600,215 527,173 527,97" stroke-width="3"/>
    <polygon points="600,75 656,107 656,163 600,195 544,163 544,107" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="570" y1="125" x2="570" y2="145"/>
    <line x1="582" y1="112" x2="582" y2="158"/>
    <line x1="594" y1="100" x2="594" y2="170"/>
    <line x1="606" y1="108" x2="606" y2="162"/>
    <line x1="618" y1="118" x2="618" y2="152"/>
    <line x1="630" y1="127" x2="630" y2="143"/>
  </g>

  <!-- titre -->
  <text x="600" y="305" text-anchor="middle" fill="#ffffff" filter="url(#glow)"
        font-family="Orbitron, Rajdhani, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="18">BRUCE</text>
  <text x="600" y="352" text-anchor="middle" fill="#bdbdbd"
        font-family="Orbitron, Rajdhani, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" letter-spacing="12">AI ASSISTANT</text>
</svg>
